{
  "name": "Montogram alpha build",
  "run-name": "Montogram CI ${{ inputs.request_id }}",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "expected_sha": {
          "description": "Reviewed source commit SHA",
          "required": true,
          "type": "string"
        },
        "request_id": {
          "description": "Unique build request identifier",
          "required": true,
          "type": "string"
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "montogram-manual-alpha",
    "cancel-in-progress": false
  },
  "jobs": {
    "build": {
      "if": "${{ github.repository == 'byteKayze/MontoGram' && github.ref == 'refs/heads/main' && github.event.repository.visibility == 'public' && github.event.repository.private == false && inputs.expected_sha == github.sha }}",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 180,
      "permissions": {
        "contents": "read"
      },
      "steps": [
        {
          "name": "Checkout reviewed source",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "ref": "${{ inputs.expected_sha }}",
            "submodules": "recursive",
            "fetch-depth": 1,
            "persist-credentials": false
          }
        },
        {
          "name": "Java 17",
          "uses": "actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad",
          "with": {
            "distribution": "temurin",
            "java-version": "17",
            "check-latest": false
          }
        },
        {
          "name": "Verified build toolchain",
          "run": "python3 ci/support.py bootstrap"
        },
        {
          "name": "Ephemeral CI identity",
          "run": "python3 ci/support.py provision",
          "env": {
            "MONTOGRAM_API_ID": "${{ secrets.MONTOGRAM_TELEGRAM_API_ID }}",
            "MONTOGRAM_API_HASH": "${{ secrets.MONTOGRAM_TELEGRAM_API_HASH }}"
          }
        },
        {
          "name": "Create managed Gradle workflow",
          "run": "python3 ci/vendor/gradle_run.py --root \"/tmp/montogram-gradle\" create"
        },
        {
          "name": "Capture managed workflow identifier",
          "id": "managed",
          "run": "python3 ci/support.py workflow-id"
        },
        {
          "name": "Compile and package canonical APK",
          "id": "build",
          "run": "python3 ci/vendor/gradle_run.py --root \"/tmp/montogram-gradle\" run --workflow \"${{ steps.managed.outputs.workflow }}\" --scope targeted --question \"Does this reviewed source compile and package the alpha5 universal64 APK?\" -- ./gradlew-montogram :TMessagesProj_AppStandalone:assembleAfatStandalone -PmontogramAbi=universal -PmontogramMinify=false -PmontogramHeapMiB=2560 --configure-on-demand --max-workers=1 --no-parallel --no-daemon --dependency-verification strict",
          "env": {
            "MONTOGRAM_JAVA_HOME": "${{ env.JAVA_HOME }}"
          }
        },
        {
          "name": "Managed build status",
          "if": "${{ always() && steps.managed.outputs.workflow != '' }}",
          "run": "python3 ci/vendor/gradle_run.py --root \"/tmp/montogram-gradle\" status --workflow \"${{ steps.managed.outputs.workflow }}\""
        },
        {
          "name": "Validate ephemeral APK handoff",
          "run": "python3 ci/support.py metadata",
          "env": {
            "MONTOGRAM_GRADLE_OUTCOME": "${{ steps.build.outcome }}"
          }
        },
        {
          "name": "Upload bounded one-day handoff",
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "with": {
            "name": "montogram-ci-${{ github.run_id }}-${{ github.run_attempt }}",
            "path": "ci-output/montogram-ci-ephemeral.apk\nci-output/ci-metadata.json",
            "if-no-files-found": "error",
            "retention-days": 1,
            "compression-level": 0,
            "include-hidden-files": false,
            "overwrite": false
          }
        },
        {
          "name": "Remove only managed Gradle logs",
          "if": "${{ always() && steps.managed.outputs.workflow != '' }}",
          "run": "python3 ci/vendor/gradle_run.py --root \"/tmp/montogram-gradle\" finish --workflow \"${{ steps.managed.outputs.workflow }}\""
        }
      ],
      "env": {
        "TMPDIR": "/tmp"
      }
    }
  }
}
