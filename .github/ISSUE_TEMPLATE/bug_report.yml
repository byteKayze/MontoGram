name: Ошибка
description: Воспроизводимая проблема в Montogram
body:
  - type: markdown
    attributes:
      value: Не добавляйте ключи, коды входа, auth/session данные и личные сообщения. Для уязвимостей сначала прочитайте SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Версия Montogram и build
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Android, устройство и ABI
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемый и фактический результат
    validations:
      required: true
