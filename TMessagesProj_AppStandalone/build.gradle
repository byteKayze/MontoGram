apply plugin: 'com.android.application'
apply plugin: 'org.telegram.build-app-plugin'

// Explicit private build option for the developer's 4GB machine. The normal
// standalone profile retains upstream R8/resource shrinking by default.
def montogramMinifySetting = providers.gradleProperty('montogramMinify').getOrElse('true')
if (!(montogramMinifySetting in ['true', 'false'])) {
    throw new GradleException('montogramMinify must be exactly true or false')
}
def montogramReleaseMinify = montogramMinifySetting == 'true'

repositories {
    mavenCentral()
    google()
}

configurations {
    compile.exclude module: 'support-v4'
}

configurations.all {
    exclude group: 'com.google.firebase', module: 'firebase-core'
    exclude group: 'androidx.recyclerview', module: 'recyclerview'
}

dependencies {
    implementation project(':TMessagesProj')
    // CVE-2026-102554: patched Android runtime, no global tooling override.
    implementation 'com.google.guava:guava:33.7.2-android'
    implementation 'androidx.fragment:fragment:1.8.9'
    implementation 'androidx.core:core:1.16.0'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation files('../TMessagesProj/libs/libgsaverification-client.aar')
}

android {
    compileSdkVersion 36
    buildToolsVersion '36.0.0'

    defaultConfig.applicationId = APP_PACKAGE


    lintOptions {
        disable 'MissingTranslation'
        disable 'ExtraTranslation'
        disable 'BlockedPrivateApi'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8

        coreLibraryDesugaringEnabled true
    }

    androidResources {
        noCompress += "pack"
        localeFilters += ["zz"]
    }

    signingConfigs {
        debug {
            storeFile rootProject.ext.montogramKeyFile
            storePassword rootProject.ext.montogramKeyPassword
            keyAlias 'montogram'
            keyPassword rootProject.ext.montogramKeyPassword
        }

        release {
            storeFile rootProject.ext.montogramKeyFile
            storePassword rootProject.ext.montogramKeyPassword
            keyAlias 'montogram'
            keyPassword rootProject.ext.montogramKeyPassword
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    buildTypes {
        debug {
            debuggable true
            jniDebuggable true
            signingConfig signingConfigs.debug
            minifyEnabled false
            multiDexEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), '../TMessagesProj/proguard-rules.pro'
            ndk.debugSymbolLevel = 'FULL'
        }
        standalone {
            matchingFallbacks = ['release']
            debuggable false
            jniDebuggable false
            signingConfig signingConfigs.release
            minifyEnabled montogramReleaseMinify
            shrinkResources montogramReleaseMinify
            if (!montogramReleaseMinify) {
                versionNameSuffix '-internal-unminified'
            }
            multiDexEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), '../TMessagesProj/proguard-rules.pro'
            ndk.debugSymbolLevel = 'FULL'
        }
    }

    sourceSets.debug {
        manifest.srcFile '../TMessagesProj/config/release/AndroidManifest_standalone.xml'
    }
    sourceSets.standalone {
        manifest.srcFile '../TMessagesProj/config/release/AndroidManifest_standalone.xml'
    }

    flavorDimensions "minApi"

    productFlavors {
        afat {
            ndk {
                abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
            }
            ext {
                abiVersionCode = 9
            }
            sourceSets.standalone {
                manifest.srcFile '../TMessagesProj/config/release/AndroidManifest_standalone.xml'
            }
        }
    }

    defaultConfig.versionCode = Integer.parseInt(APP_VERSION_CODE)

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def internalUnminified = variant.buildType.name == 'standalone' && !montogramReleaseMinify
            outputFileName = internalUnminified ? 'app-internal-unminified.apk' : 'app.apk'
            // Reserve the immediately higher code for the normal minified build.
            output.versionCodeOverride = defaultConfig.versionCode * 10 + variant.productFlavors.get(0).abiVersionCode - (internalUnminified ? 1 : 0)
        }
    }

    variantFilter { variant ->
        def names = variant.flavors*.name
        if (variant.buildType.name != "release" && !names.contains("afat")) {
            setIgnore(true)
        }
    }

    defaultConfig {
        minSdkVersion 23
        targetSdkVersion 36
        versionName APP_VERSION_NAME
        ndkVersion "27.2.12479018"

        multiDexEnabled true

        vectorDrawables.generatedDensities = ['mdpi', 'hdpi', 'xhdpi', 'xxhdpi']

        externalNativeBuild {
            cmake {
                version '3.22.1'
                arguments '-DANDROID_STL=c++_static', '-DANDROID_PLATFORM=android-21' //, '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
                targets 'tmessages.49'
            }
        }
    }

    buildFeatures {
        buildConfig = true
    }
    namespace 'org.telegram.messenger.web'

    lintOptions {
        checkReleaseBuilds false
    }
}

// No Google project configuration in the Montogram standalone variant.

// Fail closed on the actual production graph, not only a source declaration.
tasks.register('verifyMontogramRuntimeDependencies') {
    group = 'verification'
    doLast {
        def resolved = [:]
        [
            [project, 'afatStandaloneRuntimeClasspath'],
            [project, 'afatStandaloneCompileClasspath'],
            [project(':TMessagesProj'), 'standaloneRuntimeClasspath'],
            [project(':TMessagesProj'), 'standaloneCompileClasspath']
        ].each { target ->
            def owner = target[0]
            def name = target[1]
            def configuration = owner.configurations.getByName(name)
            // Resolve real external artifacts now: graph metadata alone misses JAR/AAR verification.
            configuration.incoming.artifactView {
                componentFilter { id -> id instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier }
            }.files.files
            def versions = configuration.incoming.resolutionResult.allComponents.collect { component ->
                def id = component.id
                id instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier &&
                        id.group == 'com.google.guava' && id.module == 'guava' ? id.version : null
            }.findAll { it != null }.unique().sort()
            if (versions != ['33.7.2-android']) {
                throw new GradleException('Unexpected production Guava version in ' + name + ': ' + versions)
            }
            resolved[name] = versions
        }
        def report = rootProject.layout.buildDirectory.file('montogram-runtime-dependencies.json').get().asFile
        report.parentFile.mkdirs()
        report.text = groovy.json.JsonOutput.toJson(resolved) + '\n'
        println('MONTOGRAM_RUNTIME_DEPENDENCIES ' + groovy.json.JsonOutput.toJson(resolved))
    }
}
