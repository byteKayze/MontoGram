def nativeJobs = System.getenv('MONTOGRAM_NATIVE_JOBS') ?: '1'
if (!(nativeJobs in ['1', '4'])) throw new GradleException('Unsupported native job profile')
if (nativeJobs == '4' && !(System.getenv('GITHUB_ACTIONS') == 'true' && System.getenv('GITHUB_REPOSITORY') == 'byteKayze/MontoGram')) throw new GradleException('Parallel native profile requires Montogram CI')
// Explicit, reproducible low-RAM profile. No credentials, extra repositories,
// runtime/UI edits, or changes to upstream LTO/optimization settings.
def selectedAbi = gradle.startParameter.projectProperties.get('montogramAbi') ?: 'x86_64'
if (!(selectedAbi in ['x86_64', 'arm64-v8a', 'universal'])) throw new GradleException('Unsupported test ABI')
def selectedAbis = selectedAbi == 'universal' ? ['arm64-v8a', 'x86_64'] : [selectedAbi]
gradle.beforeProject { p ->
    ['com.android.application', 'com.android.library'].each { pluginId ->
        p.plugins.withId(pluginId) {
            p.extensions.getByName('androidComponents').finalizeDsl { android ->
                android.defaultConfig.ndk.abiFilters.clear()
                android.defaultConfig.ndk.abiFilters.addAll(selectedAbis)
                android.productFlavors.all { flavor ->
                    flavor.ndk.abiFilters.clear()
                    flavor.ndk.abiFilters.addAll(selectedAbis)
                }
                if (p.name == 'TMessagesProj') {
                    android.defaultConfig.externalNativeBuild.cmake.arguments.addAll([
                        '-DCMAKE_JOB_POOLS=montogram_compile=' + nativeJobs + ';montogram_link=1',
                        '-DCMAKE_JOB_POOL_COMPILE=montogram_compile',
                        '-DCMAKE_JOB_POOL_LINK=montogram_link',
                        '-DCMAKE_ASM_NASM_COMPILER=' + new File(p.rootDir, 'setup/android-sdk/ndk/27.2.12479018/prebuilt/linux-x86_64/bin/yasm').canonicalPath,
                        '-DCMAKE_SHARED_LINKER_FLAGS=-Wl,--threads=1 -Wl,--lto-partitions=1'
                    ])
                }
            }
        }
    }
}

// CI isolates the actual compiler heap; desktop resource settings stay unchanged.
def montogramCompilerCI = System.getenv('GITHUB_ACTIONS') == 'true' && System.getenv('GITHUB_REPOSITORY') == 'byteKayze/MontoGram'
if (montogramCompilerCI) {
    gradle.beforeProject { p ->
        def selectedTask = [':TMessagesProj':'compileStandaloneJavaWithJavac', ':TMessagesProj_AppStandalone':'compileAfatStandaloneJavaWithJavac'][p.path]
        if (selectedTask != null) {
            p.tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach { task ->
                if (task.name == selectedTask) {
                    task.options.fork = true
                    task.options.forkOptions.memoryMaximumSize = '4096m'
                    task.options.forkOptions.jvmArgs = ['-XX:+UseSerialGC', '-XX:MaxMetaspaceSize=512m', '-Dfile.encoding=UTF-8']
                }
            }
        }
    }
}
gradle.rootProject {
    if (gradle.parent != null) return
    if (!(System.getenv('GITHUB_ACTIONS') == 'true' && System.getenv('GITHUB_REPOSITORY') == 'byteKayze/MontoGram')) return
    def targets = [
        [':TMessagesProj', 'compileStandaloneJavaWithJavac'],
        [':TMessagesProj_AppStandalone', 'compileAfatStandaloneJavaWithJavac']
    ]
    def compilerArgs = ['-XX:+UseSerialGC', '-XX:MaxMetaspaceSize=512m', '-Dfile.encoding=UTF-8']
    gradle.rootProject.tasks.register('verifyMontogramCompilerProfile') {
        group = 'verification'
        doLast {
            def profiles = targets.collect { target ->
                def task = gradle.rootProject.project(target[0]).tasks.named(target[1]).get()
                if (!task.options.fork || task.options.forkOptions.memoryMaximumSize != '4096m' || task.options.forkOptions.jvmArgs != compilerArgs) {
                    throw new GradleException('Unexpected isolated Java compiler configuration')
                }
                [task:task.path, fork:true, heap_mib:4096, jvm_args:compilerArgs]
            }
            def report = gradle.rootProject.layout.buildDirectory.file('montogram-compiler-profile.json').get().asFile
            report.parentFile.mkdirs()
            report.text = groovy.json.JsonOutput.toJson([
                scope:'Configured compiler options; not worker RSS or runtime JVM flag measurement',
                gradle_runtime_max_heap_mib:(Runtime.runtime.maxMemory() / 1024 / 1024) as int,
                compiler_profiles:profiles
            ]) + '\n'
        }
    }
}
